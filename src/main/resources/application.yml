spring:
  datasource:
    url: jdbc:mysql://localhost:3306/collector?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: CollectorScheduler
      org.quartz.threadPool.threadCount: 5

server:
  port: 8080
